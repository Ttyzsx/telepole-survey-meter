name: telepole_survey_meter
description: Wireless telescopic radiation survey meter dashboard (Arduino Uno over Bluetooth).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Bluetooth Classic (SPP) — HC-05 ต้องใช้ classic ไม่ใช่ BLE
  flutter_blue_classic: ^0.1.1
  # Bluetooth LE — ทางเดียวที่ iPhone ต่อกับ Arduino ได้ (HM-10 / AT-09 / JDY-23)
  # ตรึงไว้ที่ 1.x เพราะ 2.x เปลี่ยนสัญญาอนุญาตจาก BSD เป็นแบบมีเงื่อนไข
  flutter_blue_plus: ^1.35.5
  permission_handler: ^13.0.1
  fl_chart: ^0.68.0
  vibration: ^3.2.0
  audioplayers: ^6.8.1
  # จำค่าสอบเทียบและเกณฑ์เตือนไว้ข้ามการเปิด-ปิดแอป
  shared_preferences: ^2.3.3
  # บันทึกการสำรวจลงไฟล์ CSV แล้วส่งออกให้คนอื่น
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
