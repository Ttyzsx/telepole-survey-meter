name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      # โฟลเดอร์ android/ ไม่ได้ commit ไว้ ให้ flutter สร้างจาก template
      # สำรอง lib/ กับ pubspec.yaml ไว้ก่อน เผื่อ template เขียนทับ
      - name: Generate android project
        working-directory: app
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name telepole_survey_meter --org tools.telepole .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Patch AndroidManifest permissions
        working-directory: app
        run: python3 ../tool/patch_android.py

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: telepole-survey-meter-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
